[project]
name = "hwkit"
version = "0.5.1"
description = "Reusable hardware-project processes: enclosures, inlaid labels, Bambu Studio print projects, slicer checks, renders."
requires-python = ">=3.11,<3.13"
dependencies = [
    "cadquery>=2.5",
    "shapely>=2.0",
    "trimesh>=4.0",
    "networkx>=3.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.scripts]
hwkit = "hwkit.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hwkit"]

[tool.hatch.build.targets.wheel.force-include]
"lab" = "hwkit/_lab"
