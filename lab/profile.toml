# Lab equipment and defaults. Read by hwkit.lab.load(). Override the file with the environment variable HWKIT_LAB.

[tools]
bambu_studio = "/Applications/BambuStudio.app/Contents/MacOS/BambuStudio"
bambu_profiles = "/Applications/BambuStudio.app/Contents/Resources/profiles/BBL"
blender = "/Applications/Blender.app/Contents/MacOS/Blender"
kicad_cli = "/Applications/KiCad/KiCad.app/Contents/MacOS/kicad-cli"
kicad_python = "/Applications/KiCad/KiCad.app/Contents/Frameworks/Python.framework/Versions/Current/bin/python3"
ibom = "/Users/thomabir/Documents/KiCad/10.0/3rdparty/plugins/org_openscopeproject_InteractiveHtmlBom/generate_interactive_bom.py"
label_font = "/System/Library/Fonts/Supplemental/Arial Black.ttf"

[kicad]
author = "Thomas Birbacher"  # title block field "company"
id_pattern = "^[A-Z]{3}-\\d{4} "  # project identifier at the start of the title, example "PRJ-0123 "

# Symbol field names. Roles: manufacturer, mpn, datasheet (link), digikey (link), digikey_pn (DigiKey part number, the only part number in the DigiKey order file), mouser (link), mouser_pn (Mouser part number, the only part number in the Mouser order file).
# Optional roles (hwkit.kicad.checks.OPTIONAL_ROLES): order_qty (see hwkit.kicad.export.order_quantity), notes (shown in the README BOM), lcsc (LCSC part number, set by the LCSC import).
[kicad.fields]
manufacturer = "Manufacturer"
mpn = "MPN"
datasheet = "Datasheet"
digikey = "DigiKey"
digikey_pn = "DigiKey PN"
mouser = "Mouser"
mouser_pn = "Mouser PN"
order_qty = "Order Qty"
notes = "Notes"
lcsc = "LCSC Part"

# Distributor API locale (hwkit.distributors). Credentials: ~/.config/hwkit/credentials.toml.
[distributors.digikey]
site = "CH"
language = "en"
currency = "CHF"

[distributors.mouser]
currency = "CHF"  # currency of the Mouser account; the Search API has no currency parameter

[printer]
bambu_machine = "Bambu Lab X1 Carbon 0.6 nozzle"
nozzle_d = 0.6  # mm
plate_center = [128.0, 128.0]  # mm

[process]
bambu_process = "0.30mm Standard @BBL X1C 0.6 nozzle"

# Project settings that differ from the system presets. Preset keys are also entered in different_settings_to_system.
[process.choices]
sparse_infill_pattern = "gyroid"  # functional parts
curr_bed_type = "Textured PEI Plate"  # sets the bed temperature

# Filament 1, 2, ... in this order.
[[filaments]]
role = "body"
bambu = "Bambu PLA Tough+ @BBL X1C 0.6 nozzle"
colour = "#3C3C3C"

[[filaments]]
role = "label"
bambu = "Bambu PLA Basic @BBL X1C 0.6 nozzle"
colour = "#FFFFFF"

[flush]
volumes = [[0, 600], [200, 0]]  # mm3, row = from filament, column = to filament
vector_entry = "140"
